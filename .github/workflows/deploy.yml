
name: Deploy Website to S3 and CloudFront

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Diagnostic step to check GitHub OIDC context
      - name: Inspect GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::630707069621:role/GitHubActions-S3-CloudFront-Deploy
          aws-region: eu-north-1

      - name: Deploy website to S3
        run: |
          aws s3 cp index.html s3://jhayford-public-static-website-2026/index.html --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1XEOHLX2QFRK2 \
            --paths "/*"
